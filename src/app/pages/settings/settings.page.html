<ion-header>
    <ion-toolbar>
        <ion-menu-button slot="start"></ion-menu-button>
        <ion-title>Einstellungen</ion-title>
        <ion-buttons slot="primary">
            <ion-button (click)="save()">
                <ion-icon name="save" slot="icon-only"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>
<ion-content>
    <form [formGroup]="form" (ngSubmit)="save()">
        <h2 class="ion-padding">Gerät</h2>
        <ion-list lines="full">
            <ion-item>
                <ion-label position="stacked">Gerätename</ion-label>
                <ion-input formControlName="deviceName"></ion-input>
            </ion-item>
            <ion-item>
                <ion-toggle formControlName="deviceIsPrivate">
                    <ion-label>
                        <h3>Privates Gerät</h3>
                        <p>Aufnehmer:in bleibt gespeichert</p>
                    </ion-label>
                </ion-toggle>
            </ion-item>
        </ion-list>

        <h2 class="ion-padding">Administration</h2>
        <ion-list lines="full">
            <ion-item>
                <ion-label position="stacked">PIN für Auswertungen und Datenverwaltung </ion-label>
                <ion-input inputmode="numeric" type="password" formControlName="adminPin"></ion-input>
                <ion-chip slot="end" [color]="adminFeatureIsActivated() ? 'success' : 'primary'">{{ adminFeatureIsActivated() ? "aktiv" : "inaktiv" }}</ion-chip>
            </ion-item>
            <ion-item>
                <ion-toggle formControlName="bonDebugMenu">
                    <ion-label>
                        <h3>Bon Druck Fehlerbehebung</h3>
                        <p>Menü, um Bons im Fehlerfall suchen und nochmal Drucken zu können</p>
                    </ion-label>
                </ion-toggle>
            </ion-item>
            <ion-item>
                <ion-label position="stacked">API</ion-label>
                <ion-input type="text" formControlName="apiBaseUrl"></ion-input>
            </ion-item>
        </ion-list>
    </form>
</ion-content>
