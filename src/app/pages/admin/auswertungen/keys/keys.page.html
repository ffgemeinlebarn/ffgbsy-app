<ion-header>
    <ion-toolbar>
        <ion-menu-button slot="start"></ion-menu-button>
        <ion-title>Kennzahlen</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <ffgbsy-keys-item label="Gesamt" [keys]="kennzahlen()?.gesamt"></ffgbsy-keys-item>

    @for (tag of kennzahlen()?.taeglich; track tag.datum) {
        <ffgbsy-keys-item [label]="tag.label" [keys]="tag"></ffgbsy-keys-item>
    }
</ion-content>
