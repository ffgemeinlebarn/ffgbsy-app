name: Build Check for Pull Request

on:
  push:
    branches:
      - feature/*
      - bugfix/*
      - maintenance/*

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run ci:build:production
